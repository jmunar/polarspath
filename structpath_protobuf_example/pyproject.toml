[project]
name = "structpath_protobuf_example"
version = "0.1.0"
description = "Polars Protobuf utilities"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars",
    "protobuf==5.29.3",
    "pyarrow",
]

[dependency-groups]
dev = [
    "bandit",
    "maturin",
    "notebook",
    "pytest",
    "ruff>=0.12.7",
]

[tool.hatch.build.targets.sdist]
include = ["structpath_protobuf_example"]

[tool.hatch.build.targets.wheel]
include = ["structpath_protobuf_example"]

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
