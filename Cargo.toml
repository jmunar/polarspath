[workspace]
members = [
    "crates/polars-structpath-derive",
    "crates/polars-structpath",
    "crates/polars-protobuf",
    "crates/polars-lance",
    "examples/example_protobuf"
]

resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal dependencies
polars-structpath-derive = { version = "0.4.0", path = "crates/polars-structpath-derive" }
polars-structpath = { version = "0.4.0", path = "crates/polars-structpath" }
polars-protobuf = { version = "0.4.0", path = "crates/polars-protobuf" }

# Common dependencies
bytes = "1.10.1"
paste = "1.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
thiserror = "1.0.69"
syn = { version = "2.0.111", features = ["full"] }

# Polars dependencies
polars-core = { version = "0.53.0", default-features = false }
polars-arrow = { version = "0.53.0", default-features = false }
polars-lazy = { version = "0.53.0", default-features = false }

# Protocol Buffers
prost = "0.14.1"
prost-build = "0.14.1"
prost-types = "0.14.1"

# Python bindings
pyo3 = { version = "0.27.0", features = ["abi3-py38"] }
pyo3-polars = { version = "0.26.0", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }

# Lance dependencies
# NOTE: lance pinned to 0.39 due to chrono version conflict:
# polars-arrow 0.53 requires chrono<=0.4.41, lance>=1.0 requires chrono>=0.4.42 (via datafusion).
# Upgrade to lance 2.x once polars releases chrono 0.4.42 support (PR pola-rs/polars#26075).
lance = { version = "0.39", default-features = false }
arrow = { version = "56.1", default-features = false }
arrow-schema = { version = "56.1", default-features = false }
arrow-array = { version = "56.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"

# Dev dependencies
trybuild = "1.0"
rayon = "1.10"
tempfile = "3"

