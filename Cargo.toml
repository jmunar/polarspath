[workspace]
members = [
    "structpath_types",
    "structpath_derive",
    "structpath",
    "structpath_protobuf",
    "structpath_protobuf_example"
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal dependencies
structpath_types = { path = "structpath_types" }
structpath_derive = { path = "structpath_derive" }
structpath = { path = "structpath" }
structpath_protobuf = { path = "structpath_protobuf" }

# Common dependencies
indexmap = "*"
proc-macro2 = "*"
quote = "*"
thiserror = "*"
syn = { version = "*", features = ["full"] }

# Polars dependencies
polars-core = { version = "*", default-features = false }
polars-arrow = { version = "*", default-features = false }

# Protocol Buffers
prost = "*"
prost-build = "*"
prost-types = "*"

# Python bindings
pyo3 = { version = "*", features = ["abi3-py38"] }
pyo3-polars = { version = "*", features = ["derive"] }

# Serialization
serde = { version = "*", features = ["derive"] }

# Dev dependencies
trybuild = "1.0"

