syntax = "proto3";

package example_protobuf;

// Address as a top-level message (not nested)
message Address {
  string street = 1;
  string city = 2;
  int32 zip_code = 3;
}

// Status as a top-level enum (not nested)
enum Status {
  UNKNOWN = 0;
  ACTIVE = 1;
  INACTIVE = 2;
}

message Person {
  string name = 1;
  int64 age = 2;
  optional string email = 3;
  bool is_active = 4;
  Address address = 5;
  repeated string tags = 6;
  Status status = 7;
  repeated Address previous_addresses = 8;
}
