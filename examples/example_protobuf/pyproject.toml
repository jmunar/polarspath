[project]
name = "example_protobuf"
version = "0.1.0"
description = "Python package for example_protobuf"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars",
    "protobuf",
    "pyarrow",
]

[dependency-groups]
dev = [
    "bandit",
    "maturin",
    "notebook",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.sdist]
include = ["example_protobuf"]

[tool.hatch.build.targets.wheel]
include = ["example_protobuf"]

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.3.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
module-name = "example_protobuf._example_protobuf_rust"
